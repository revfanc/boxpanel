name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CGO_ENABLED: '0'
    steps:
      # Stable releases verified 2026-11-09; all published more than 7 days ago.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: Install check tools and frontend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pnpm --dir web install --frozen-lockfile
      - name: Validate and build frontend
        run: make tools lint test build-web
      - name: Build and checksum Linux release archives
        run: bash scripts/build-release.sh "$RUNNER_TEMP/release"
      - name: Verify archives and Ubuntu container dry-run
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum -c checksums.txt
          for arch in amd64 arm64; do
            test "$(tar -tzf "boxpanel-linux-$arch.tar.gz")" = boxpanel
          done
          tar -xzf boxpanel-linux-amd64.tar.gz
          test "$(./boxpanel version)" = "boxpanel $RELEASE_TAG"
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -v "$RUNNER_TEMP/release:/release:ro" \
            -e RELEASE_TAG ubuntu:24.04 bash -euc '
              bash /work/scripts/install.sh install --non-interactive --dry-run --version "$RELEASE_TAG"
              bash /work/scripts/install_test.sh
              /release/boxpanel init --data-dir /tmp/panel --public-ip 127.0.0.1 --port 23456 >/dev/null
              /release/boxpanel info --data-dir /tmp/panel
            '
      - name: Create GitHub Release and upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Keep a failed upload as a draft. A retry can complete that draft;
          # never overwrite assets belonging to an already published release.
          if gh release view "$RELEASE_TAG" --json isDraft >"$RUNNER_TEMP/release-state.json"; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release-state.json")" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/boxpanel-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/release/boxpanel-linux-arm64.tar.gz" \
            "$RUNNER_TEMP/release/checksums.txt" --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
