name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Install ShellCheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Check shell scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh
      - name: Lint, test and build
        # Install outside unit tests; future golden tests discover it on PATH.
        run: make tools lint test build
      - name: Check version command
        run: bin/boxpanel version
      - name: Installer dry-run in Ubuntu container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" ubuntu:24.04 bash -euc '
            bash /work/scripts/install.sh --non-interactive --dry-run --version v0.1.0-rc.1
            bash /work/scripts/install_test.sh
            /work/bin/boxpanel init --data-dir /tmp/panel --public-ip 127.0.0.1 --port 23456 >/dev/null
            /work/bin/boxpanel info --data-dir /tmp/panel
          '
