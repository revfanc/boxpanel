name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Install ShellCheck
        if: runner.os == 'Linux'
        # Pin the same ShellCheck version used locally; distro packages lag behind.
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Check shell scripts
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh
      - name: Lint, test and build
        # Install outside unit tests; future golden tests discover it on PATH.
        run: make tools lint test build
      - name: Check version command
        run: bin/boxpanel version
      - name: Installer dry-run in Ubuntu container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" ubuntu:24.04 bash -euc '
            bash /work/scripts/install.sh --non-interactive --dry-run --version v0.1.0-rc.1
            bash /work/scripts/install_test.sh
            /work/bin/boxpanel init --data-dir /tmp/panel --public-ip 127.0.0.1 --port 23456 >/dev/null
            /work/bin/boxpanel info --data-dir /tmp/panel
          '
